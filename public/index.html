<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f6f8">
<title>線上圍棋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='12' r='9' fill='%2317191c'/%3E%3Ccircle cx='20' cy='20' r='9' fill='white' stroke='%2317191c' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260912x">
</head>

<body>

<!-- ==================== 確認對話框 ==================== -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-title" id="modalTitle" data-i18n="modal.confirmTitle">確認</div>
    <div class="modal-body" id="modalBody" data-i18n="modal.confirmBody">是否執行此操作？</div>

    <div class="modal-actions">
      <button id="modalCancel" class="btn ghost modal-btn" data-i18n="modal.cancel">取消</button>
      <button id="modalOk" class="btn primary modal-btn" data-i18n="modal.ok">確定</button>
    </div>
  </div>
</div>

<!-- ==================== 設置面板 ==================== -->
<div id="settingsOverlay" class="modal-overlay hidden">
  <div class="modal settings-modal">

    <div class="modal-head">
      <div class="modal-title" data-i18n="settings.title">設置</div>
      <button type="button" id="settingsClose" class="icon-btn" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div class="setting-row">
      <div class="setting-label" data-i18n="settings.theme">主題</div>
      <div class="segmented" id="themeSeg">
        <button type="button" data-value="light" data-i18n="settings.light">淺色</button>
        <button type="button" data-value="dark" data-i18n="settings.dark">深色</button>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-label" data-i18n="settings.lang">語言</div>
      <div class="segmented" id="langSeg">
        <button type="button" data-value="zh-TW">繁體中文</button>
        <button type="button" data-value="en">English</button>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-label" data-i18n="settings.sound">音效</div>
      <label class="switch">
        <input type="checkbox" id="sndOn" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="sound-detail" id="soundDetail">
      <div class="setting-row">
        <div class="setting-label" data-i18n="settings.volume">音量</div>
        <input type="range" id="sndVol" class="vol-slider" min="0" max="100" step="5" value="70">
      </div>

      <label class="check-row">
        <input type="checkbox" id="sndStone" checked>
        <span data-i18n="sound.stone">落子音</span>
      </label>

      <label class="check-row">
        <input type="checkbox" id="sndCapture" checked>
        <span data-i18n="sound.capture">提子音</span>
      </label>

      <label class="check-row">
        <input type="checkbox" id="sndMsg" checked>
        <span data-i18n="sound.msg">訊息音</span>
      </label>
    </div>

    <div class="setting-row">
      <div class="setting-label" data-i18n="settings.jukebox">唱片機</div>
      <label class="switch">
        <input type="checkbox" id="jbOn">
        <span class="slider"></span>
      </label>
    </div>

  </div>
</div>

<!-- ==================== 衣櫥 ==================== -->
<div id="wardrobeOverlay" class="modal-overlay hidden">
  <div class="modal wardrobe-modal">

    <div class="modal-head">
      <div class="modal-title" data-i18n="wardrobe.title">衣櫥</div>
      <button type="button" id="wardrobeClose" class="icon-btn" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div class="segmented wardrobe-tabs" id="wardrobeTabs">
      <button type="button" class="checked" data-tab="stone" data-i18n="wardrobe.stones">棋子皮膚</button>
      <button type="button" data-tab="fx" data-i18n="wardrobe.fx">落子特效</button>
      <button type="button" data-tab="cap" data-i18n="wardrobe.cap">提子特效</button>
      <button type="button" data-tab="last" data-i18n="wardrobe.last">最後一手</button>
      <button type="button" data-tab="board" data-i18n="wardrobe.boards">棋盤皮膚</button>
    </div>

    <!-- 棋子皮膚 -->
    <div id="wardrobeStonePanel">
      <div class="skin-preview-card">
        <canvas id="skinPreviewMain" width="480" height="96"></canvas>
        <div class="skin-preview-name" id="skinPreviewName">經典</div>
      </div>
      <div class="skin-strip" id="skinSeg">
        <button type="button" class="skin-thumb checked" data-value="classic" data-i18n-title="skin.classic">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb" data-value="pig" data-i18n-title="skin.pig">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb" data-value="shiba" data-i18n-title="skin.shiba">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb" data-value="cat" data-i18n-title="skin.cat">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb" data-value="panda" data-i18n-title="skin.panda">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb" data-value="galaxy" data-i18n-title="skin.galaxy">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb" data-value="math" data-i18n-title="skin.math">
          <canvas width="56" height="28"></canvas>
        </button>
      </div>
    </div>

    <!-- 落子特效:與棋子皮膚同版式(大預覽 + 縮圖選條) -->
    <div id="wardrobeFxPanel" class="hidden">
      <div class="skin-preview-card">
        <canvas id="fxPreviewMain" width="480" height="110"></canvas>
        <div class="skin-preview-name" id="fxPreviewName">無</div>
      </div>
      <div class="skin-strip" id="fxSeg">
        <button type="button" class="skin-thumb fx-thumb checked" data-value="none" data-i18n-title="fx.noneDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="qi" data-i18n-title="fx.qiDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="math" data-i18n-title="fx.mathDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="spark" data-i18n-title="fx.sparkDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="ripple" data-i18n-title="fx.rippleDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="petal" data-i18n-title="fx.petalDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="bolt" data-i18n-title="fx.boltDesc">
          <canvas width="56" height="28"></canvas>
        </button>
      </div>
    </div>

    <!-- 提子特效:與棋子皮膚同版式(大預覽 + 縮圖選條) -->
    <div id="wardrobeCapPanel" class="hidden">
      <div class="skin-preview-card">
        <canvas id="capPreviewMain" width="480" height="110"></canvas>
        <div class="skin-preview-name" id="capPreviewName">無</div>
      </div>
      <div class="skin-strip" id="capSeg">
        <button type="button" class="skin-thumb fx-thumb checked" data-value="none" data-i18n-title="cap.noneDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="boom" data-i18n-title="cap.boomDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="shatter" data-i18n-title="cap.shatterDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="ash" data-i18n-title="cap.ashDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="dust" data-i18n-title="cap.dustDesc">
          <canvas width="56" height="28"></canvas>
        </button>
      </div>
    </div>

    <!-- 最後一手標記:與棋子皮膚同版式(大預覽 + 縮圖選條) -->
    <div id="wardrobeLastPanel" class="hidden">
      <div class="skin-preview-card">
        <canvas id="mkPreviewMain" width="480" height="110"></canvas>
        <div class="skin-preview-name" id="mkPreviewName">紅圈</div>
      </div>
      <div class="skin-strip" id="mkSeg">
        <button type="button" class="skin-thumb fx-thumb checked" data-value="ring" data-i18n-title="mk.ringDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="pulse" data-i18n-title="mk.pulseDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="blink" data-i18n-title="mk.blinkDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="spin" data-i18n-title="mk.spinDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="stars" data-i18n-title="mk.starsDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="planet" data-i18n-title="mk.planetDesc">
          <canvas width="56" height="28"></canvas>
        </button>
        <button type="button" class="skin-thumb fx-thumb" data-value="tornado" data-i18n-title="mk.tornadoDesc">
          <canvas width="56" height="28"></canvas>
        </button>
      </div>
    </div>

    <!-- 棋盤皮膚:敬請期待 -->
    <div id="wardrobeBoardPanel" class="hidden">
      <div class="wardrobe-soon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
        </svg>
        <div class="soon-text" data-i18n="wardrobe.boardSoon">棋盤皮膚敬請期待</div>
        <div class="soon-sub" data-i18n="wardrobe.boardSoonSub">木紋、石盤、星空棋盤主題製作中</div>
      </div>
    </div>

  </div>
</div>

<!-- ==================== 唱片機 ==================== -->
<div id="jukeboxPanel" class="jukebox">

  <div class="jb-head">
    <div class="jb-title" data-i18n="jb.title">唱片機</div>
    <button type="button" id="jukeboxClose" class="icon-btn small" aria-label="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <div class="jb-record" id="jbRecord" aria-hidden="true">
    <div class="jb-disc">
      <div class="jb-label">
        <span class="jb-dot b"></span>
        <span class="jb-dot w"></span>
      </div>
    </div>
    <div class="jb-tonearm"></div>
  </div>

  <div class="jb-info">
    <div id="jbName" class="jb-name">—</div>
    <div id="jbCount" class="jb-count"></div>
  </div>

  <div class="jb-controls">
    <button type="button" id="jbPrev" class="icon-btn" data-i18n-title="jb.prev" aria-label="上一首">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M6 6h2.2v12H6z"/>
        <path d="M18 6.5v11L8.8 12z"/>
      </svg>
    </button>
    <button type="button" id="jbPlay" class="icon-btn jb-play" aria-label="播放/暫停">
      <svg id="jbPlayIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5.3v13.4L19 12z"/>
      </svg>
      <svg id="jbPauseIcon" class="hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.6z"/>
      </svg>
    </button>
    <button type="button" id="jbNext" class="icon-btn" data-i18n-title="jb.next" aria-label="下一首">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M15.8 6H18v12h-2.2z"/>
        <path d="M6 6.5v11L15.2 12z"/>
      </svg>
    </button>
    <button type="button" id="jbRepeat" class="icon-btn" aria-label="循環模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 2.5l3 3-3 3"/>
        <path d="M20 5.5H7a4 4 0 0 0-4 4v1"/>
        <path d="M7 21.5l-3-3 3-3"/>
        <path d="M4 18.5h13a4 4 0 0 0 4-4v-1"/>
      </svg>
    </button>
  </div>

  <div class="jb-vol-row">
    <span class="jb-vol-label" data-i18n="jb.volume">音量</span>
    <input type="range" id="jbVol" class="vol-slider" min="0" max="100" step="5" value="80">
  </div>

  <div id="jbEmpty" class="jb-empty" data-i18n="jb.empty">選擇裝置裡的 MP4 開始播放
支援一次加入多個檔案</div>
  <div id="jbList" class="jb-list hidden"></div>

  <div class="jb-actions">
    <button type="button" id="jbPickFilesBtn" class="btn small" data-i18n="jb.pickFiles">選擇檔案</button>
    <button type="button" id="jbPickFolderBtn" class="btn small ghost" data-i18n="jb.pickFolder">選擇資料夾</button>
    <button type="button" id="jbClear" class="btn small ghost" data-i18n="jb.clear">清空</button>
  </div>

  <input type="file" id="jbFiles" class="hidden" multiple accept=".mp4,.mp3,video/mp4,audio/mpeg">
  <input type="file" id="jbFolder" class="hidden" webkitdirectory>

</div>

<div id="app">

  <header class="app-header">
    <button type="button" id="wardrobeBtn" class="icon-btn header-btn wb" data-i18n-title="wardrobe.title" aria-label="衣櫥">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
      </svg>
    </button>
    <button type="button" id="jukeboxBtn" class="icon-btn header-btn jb hidden" data-i18n-title="jb.title" aria-label="唱片機">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/>
        <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button type="button" id="settingsBtn" class="icon-btn header-btn" data-i18n-title="settings.title" aria-label="設置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M4 8h9M19.5 8H20M4 16h3M11.5 16H20"/>
        <circle cx="16" cy="8" r="2.4"/>
        <circle cx="9" cy="16" r="2.4"/>
      </svg>
    </button>

    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="12.5" cy="12" r="8.5" fill="#17191c"/>
        <circle cx="20" cy="20" r="8.5" fill="#ffffff" stroke="#17191c" stroke-width="1.6"/>
      </svg>
      <h1 data-i18n="app.title">線上圍棋</h1>
    </div>
    <div class="tagline" data-i18n="app.tagline">對弈 · 連線 · 手談</div>
  </header>

  <!-- ==================== 大廳 ==================== -->
  <div id="lobby" class="screen">

    <div id="lobbyHome">

      <section class="card">
        <h2 data-i18n="mode.title">對戰模式</h2>

        <div class="mode-grid">

          <button class="mode-btn" data-action="hotseat">
            <div class="mode-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9.2" cy="9.2" r="5.4" fill="currentColor"/>
                <circle cx="14.8" cy="14.8" r="5.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </div>
            <div class="mode-title" data-i18n="mode.local">單機雙人</div>
            <div class="mode-desc" data-i18n="mode.localDesc">同一畫面兩人輪流</div>
          </button>

          <button class="mode-btn" data-action="p2p-host">
            <div class="mode-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="3.5"/>
                <path d="M12 9v6M9 12h6"/>
              </svg>
            </div>
            <div class="mode-title" data-i18n="mode.host">建立房間</div>
            <div class="mode-desc" data-i18n="mode.hostDesc">產生邀請碼</div>
          </button>

          <button class="mode-btn" data-action="goto-join">
            <div class="mode-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/>
                <path d="M4 12h10M10 8l4 4-4 4"/>
              </svg>
            </div>
            <div class="mode-title" data-i18n="mode.join">加入房間</div>
            <div class="mode-desc" data-i18n="mode.joinDesc">輸入邀請碼</div>
          </button>

        </div>
      </section>

      <!-- 棋盤大小 -->
      <section class="card">
        <h2 data-i18n="size.title">棋盤大小</h2>

        <div class="size-row">

          <label class="checked">
            <input type="radio" name="boardSize" value="9">
            <span>9 × 9</span>
            <small data-i18n="size.beginner">入門</small>
          </label>

          <label>
            <input type="radio" name="boardSize" value="13">
            <span>13 × 13</span>
            <small data-i18n="size.intermediate">中級</small>
          </label>

          <label>
            <input type="radio" name="boardSize" value="19" checked>
            <span>19 × 19</span>
            <small data-i18n="size.standard">標準</small>
          </label>

        </div>
      </section>

      <!-- 恢復對局 -->
      <section id="resumeCard" class="card hidden">
        <h2 data-i18n="resume.title">恢復對局</h2>

        <div id="resumeInfo" class="resume-info"></div>

        <div class="resume-actions">
          <button id="resumeBtn" class="btn primary" data-i18n="resume.continue">
            繼續上一局
          </button>

          <button id="clearResumeBtn" class="btn ghost" data-i18n="resume.clear">
            清除記錄
          </button>
        </div>
      </section>

    </div>

    <!-- ==================== 建立房間 ==================== -->
    <div id="p2pHostScreen" class="hidden">

      <div class="sub-nav">
        <button id="backFromHost" class="btn ghost small">
          ← <span data-i18n="act.leave">返回大廳</span>
        </button>
      </div>

      <section class="card">
        <h2 data-i18n="host.title">等待對手加入</h2>

        <div class="code-display">

          <div class="code-label" data-i18n="host.codeLabel">
            邀請碼
          </div>

          <input
            type="text"
            id="p2pRoomCode"
            readonly
            class="room-code-input"
          >

          <div class="row">
            <button id="copyRoomBtn" class="btn" data-i18n="host.copy">
              複製
            </button>

            <button id="shareRoomBtn" class="btn ghost" data-i18n="host.share">
              分享連結
            </button>
          </div>

        </div>

        <div id="p2pHostStatus" class="status pending">
          連線中...
        </div>

      </section>
    </div>

    <!-- ==================== 加入房間 ==================== -->
    <div id="p2pJoinScreen" class="hidden">

      <div class="sub-nav">
        <button id="backFromJoin" class="btn ghost small">
          ← <span data-i18n="act.leave">返回大廳</span>
        </button>
      </div>

      <section class="card">

        <h2 data-i18n="join.title">加入房間</h2>

        <div class="code-display">

          <div class="code-label" data-i18n="join.codeLabel">
            輸入邀請碼
          </div>

          <input
            type="text"
            id="p2pRoomInput"
            placeholder="例如：G7XK2M"
            data-i18n-placeholder="join.placeholder"
            maxlength=""
            class="room-code-input"
          >

          <button id="submitRoomBtn" class="btn primary big" data-i18n="join.submit">
            加入
          </button>

          <button id="submitSpectateBtn" class="btn ghost big" data-i18n="join.spectate">
            觀戰加入
          </button>

        </div>

        <div id="p2pJoinStatus" class="status">
          等待輸入邀請碼
        </div>

      </section>
    </div>

  </div>

  <!-- ==================== 遊戲畫面 ==================== -->
  <div id="gameScreen" class="screen hidden">

    <div class="game-layout">

      <!-- 左側 -->
      <aside class="side">

        <div class="card">

          <div class="stat-row">
            <span class="stat-label" data-i18n="game.mode">模式</span>
            <span id="connMode" class="badge">單機</span>
          </div>

          <div class="stat-row">
            <span class="stat-label" data-i18n="game.you">你是</span>
            <span id="myRole">-</span>
          </div>

          <div class="stat-row">
            <span class="stat-label" data-i18n="game.status">狀態</span>
            <span id="connStatus" class="badge ok">
              已連線
            </span>
          </div>

        </div>

        <div class="card players">

          <div class="player black" id="blackCard">
            <div class="stone-dot black"></div>

            <div class="player-meta">
              <div class="player-name">
                <span data-i18n="player.black">黑棋</span>
                <span id="blackStatus" data-i18n="player.ready">已就緒</span>
              </div>

              <div class="player-cap">
                <span data-i18n="player.captures">提子</span>
                <b id="blackCaptures">0</b>
              </div>
            </div>
          </div>

          <div class="player white" id="whiteCard">
            <div class="stone-dot white"></div>

            <div class="player-meta">
              <div class="player-name">
                <span data-i18n="player.white">白棋</span>
                <span id="whiteStatus" data-i18n="player.ready">已就緒</span>
              </div>

              <div class="player-cap">
                <span data-i18n="player.captures">提子</span>
                <b id="whiteCaptures">0</b>
              </div>
            </div>
          </div>

        </div>

        <div class="card turn" id="turnIndicator">
          <div id="turnText" data-i18n="turn.blackFirst">
            黑棋先行
          </div>
        </div>

      </aside>

      <!-- 棋盤 -->
      <main class="board-wrap">
        <canvas id="boardCanvas"></canvas>
      </main>

      <!-- 右側 -->
      <aside class="side">

        <div class="card actions">

          <button id="passBtn" class="btn" data-i18n="act.pass">
            虛手 Pass
          </button>

          <button id="undoBtn" class="btn" data-i18n="act.undo">
            悔棋
          </button>

          <button id="newGameBtn" class="btn ghost" data-i18n="act.newGame">
            新對局
          </button>

          <button id="leaveBtn" class="btn danger" data-i18n="act.leave">
            返回大廳
          </button>

        </div>

        <div class="card log-card">
          <div id="messageLog" class="log"></div>
        </div>

        <!-- 對局聊天（新增，不影響原有功能） -->
        <div class="card chat-card" id="chatCard">
          <div class="chat-head" id="chatHead">
            <span class="chat-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
              </svg>
              <span data-i18n="chat.title">對局聊天</span>
            </span>
            <span class="chat-unread hidden" id="chatUnread">0</span>
            <button type="button" class="chat-toggle" id="chatToggle" aria-label="收合/展開聊天">▾</button>
          </div>

          <div class="chat-body" id="chatBody">
            <div id="chatMsgs" class="chat-msgs"></div>

            <div id="chatQuick" class="chat-quick"></div>

            <div class="chat-input-row">
              <button type="button" id="chatEmojiBtn" class="chat-emoji-btn" title="表情" data-i18n-title="chat.emoji">😀</button>
              <input
                type="text"
                id="chatInput"
                class="chat-input"
                maxlength="200"
                placeholder="輸入訊息…"
                data-i18n-placeholder="chat.placeholder"
                autocomplete="off"
              >
              <button type="button" id="chatSendBtn" class="btn primary chat-send" data-i18n="chat.send">傳送</button>
            </div>

            <div id="chatEmojiGrid" class="chat-emoji-grid hidden"></div>
          </div>
        </div>

      </aside>

    </div>
  </div>

</div>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script src="i18n.js?v=20260912x"></script>
<script src="sound.js?v=20260912x"></script>
<script src="settings.js?v=20260912x"></script>
<!-- 落子特效 -->
<script src="fx.js?v=20260912x"></script>

<!-- 遊戲程式 -->
<script src="app.js?v=20260912x"></script>

<!-- 對局聊天（新增模組，掛接 app.js 全域連線） -->
<script src="chat.js?v=20260912x"></script>

<!-- 唱片機（MP4 循環播放） -->
<script src="jukebox.js?v=20260912x"></script>

<!-- 衣櫥（皮膚管理） -->
<script src="wardrobe.js?v=20260912x"></script>

</body>
</html>
